name: ci

on:
  push:
    branches: ["master", "main", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - name: Install documentation dependencies
        working-directory: docs-site
        run: pnpm install --frozen-lockfile
      - name: Build documentation and validate links
        working-directory: docs-site
        run: pnpm build
      - name: Audit documentation dependencies
        working-directory: docs-site
        run: pnpm audit --audit-level high

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore UnifyEMPI.slnx --locked-mode
      - name: Verify formatting
        run: dotnet format UnifyEMPI.slnx --no-restore --verify-no-changes
      - name: Build
        run: dotnet build UnifyEMPI.slnx -c Release --no-restore
      - name: Test
        run: dotnet test UnifyEMPI.slnx -c Release --no-build --logger trx --results-directory TestResults
      - name: Audit NuGet packages
        run: dotnet list UnifyEMPI.slnx package --vulnerable --include-transitive
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: src/UnifyEmpi.Api/Dockerfile
          - name: mllp
            dockerfile: src/UnifyEmpi.Hl7v2.Host/Dockerfile
          - name: portal
            dockerfile: src/UnifyEmpi.Portal/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: unifyempi-${{ matrix.name }}:${{ github.sha }}
      - uses: anchore/sbom-action@v0
        with:
          image: unifyempi-${{ matrix.name }}:${{ github.sha }}
          artifact-name: unifyempi-${{ matrix.name }}.spdx.json
      - name: Gate high and critical container vulnerabilities
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: unifyempi-${{ matrix.name }}:${{ github.sha }}
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Generate container vulnerability report
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: unifyempi-${{ matrix.name }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          scanners: vuln
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore benchmarks/UnifyEmpi.Benchmarks/UnifyEmpi.Benchmarks.csproj --locked-mode
      - run: dotnet run --project benchmarks/UnifyEmpi.Benchmarks -c Release --no-restore -- --filter '*ScoreFiveHundred*' --job short --exporters json
      - shell: pwsh
        run: ./scripts/Test-BenchmarkRegression.ps1

  live-gcp:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: isolated-gcp-test-store
    permissions:
      contents: read
      id-token: write
    env:
      GCP_FHIR_STORE: ${{ vars.GCP_FHIR_STORE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - run: dotnet restore tests/UnifyEmpi.Storage.Gcp.LiveTests/UnifyEmpi.Storage.Gcp.LiveTests.csproj --locked-mode
      - run: dotnet test tests/UnifyEmpi.Storage.Gcp.LiveTests/UnifyEmpi.Storage.Gcp.LiveTests.csproj -c Release --no-restore
