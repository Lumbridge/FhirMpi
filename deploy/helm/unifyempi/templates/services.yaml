apiVersion: v1
kind: Service
metadata:
  name: {{ include "unifyempi.name" . }}-api
spec:
  selector: { app.kubernetes.io/name: unifyempi, app.kubernetes.io/component: api }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "unifyempi.name" . }}-mllp
spec:
  selector: { app.kubernetes.io/name: unifyempi, app.kubernetes.io/component: mllp }
  ports: [{ name: mllp, port: {{ .Values.service.mllpPort }}, targetPort: mllp }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "unifyempi.name" . }}-portal
spec:
  sessionAffinity: {{ .Values.service.portalSessionAffinity }}
  selector: { app.kubernetes.io/name: unifyempi, app.kubernetes.io/component: portal }
  ports: [{ name: http, port: 80, targetPort: http }]
