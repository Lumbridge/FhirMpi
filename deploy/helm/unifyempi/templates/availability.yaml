apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: unifyempi-api }
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: { app.kubernetes.io/name: unifyempi, app.kubernetes.io/component: api }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: unifyempi-mllp }
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: { app.kubernetes.io/name: unifyempi, app.kubernetes.io/component: mllp }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: unifyempi-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: unifyempi-api }
  minReplicas: {{ .Values.autoscaling.api.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.api.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.autoscaling.api.targetCPUUtilizationPercentage }} }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: unifyempi-mllp }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: unifyempi-mllp }
  minReplicas: {{ .Values.autoscaling.mllp.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.mllp.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.autoscaling.mllp.targetCPUUtilizationPercentage }} }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: unifyempi-portal }
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: { app.kubernetes.io/name: unifyempi, app.kubernetes.io/component: portal }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: unifyempi-portal }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: unifyempi-portal }
  minReplicas: {{ .Values.autoscaling.portal.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.portal.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.autoscaling.portal.targetCPUUtilizationPercentage }} }
