image:
  api:
    repository: ghcr.io/example/unifyempi-api
    tag: latest
  mllp:
    repository: ghcr.io/example/unifyempi-mllp
    tag: latest
  portal:
    repository: ghcr.io/example/unifyempi-portal
    tag: latest
  pullPolicy: IfNotPresent

replicaCount:
  api: 2
  mllp: 2
  portal: 2

service:
  apiPort: 8080
  mllpPort: 2575
  portalPort: 8080
  portalSessionAffinity: ClientIP

gcpServiceAccount: ""

provider:
  type: GcpHealthcare
  gcpStoreName: ""

authentication:
  authority: ""
  audience: unifyempi

portalAuthentication:
  authority: ""
  clientId: ""
  tenantClaimType: tenant_id
  requireHttpsMetadata: true

validation:
  packagePvc: unifyempi-validation-packages
  packagePath: /profiles
  poolSize: 8

portal:
  dataProtectionKeyPath: /var/unifyempi/data-protection
  dataProtectionPvc: unifyempi-portal-data-protection
  circuitRetentionMinutes: 3
  overviewLoadTimeoutSeconds: 20
  managedSourceSystem: portal

secrets:
  configurationSecretName: unifyempi-configuration
  mllpTlsSecretName: unifyempi-mllp-tls

resources:
  api:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }
  mllp:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  portal:
    requests: { cpu: 250m, memory: 384Mi }
    limits: { cpu: "1", memory: 1Gi }

autoscaling:
  api: { minReplicas: 2, maxReplicas: 20, targetCPUUtilizationPercentage: 70 }
  mllp: { minReplicas: 2, maxReplicas: 10, targetCPUUtilizationPercentage: 70 }
  portal: { minReplicas: 2, maxReplicas: 10, targetCPUUtilizationPercentage: 70 }

podDisruptionBudget:
  minAvailable: 1
